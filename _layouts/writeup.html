---
layout: default
---
<section class="section">
  <a href="{{ '/' | relative_url }}#writeups" class="mono" style="font-size:12px;color:var(--fog)">← Back to writeups</a>
  <p class="mono" style="font-size:12px;color:var(--mist);margin-top:16px">{{ page.date | date: "%Y-%m-%d" }} · {{ page.read_time }} · {{ page.category }}</p>
  <h1 style="margin-top:8px">{{ page.title }}</h1>
  <p class="sub">Tags: {{ page.tags | join: ", " }}</p>
  <div style="font-size:15px;line-height:1.8;color:var(--slate);margin-top:24px">{{ content }}</div>
</section>
